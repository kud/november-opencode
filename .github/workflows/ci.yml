name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate theme JSON
        run: node -e "JSON.parse(require('fs').readFileSync('november.json', 'utf8')); console.log('november.json: valid')"
